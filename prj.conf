# Application core configuration.
CONFIG_SPEED_OPTIMIZATIONS=y

# C library / FP
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Kernel
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_SPIN_VALIDATE=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_EVENTS=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_RING_BUFFER=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_POSIX_API=y
CONFIG_PM_DEVICE=y

# Logging / console
CONFIG_LOG=y
CONFIG_PRINTK=y

# Buses and drivers
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_WATCHDOG=y
CONFIG_NRFX_SPIM3=y
CONFIG_NRFX_SPIM4=y
CONFIG_NRFX_PDM=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_MFD_NPM1300=y
CONFIG_GPIO_NPM1300=y
CONFIG_WDT_NPM1300=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_NPM1300=y
CONFIG_NPM1300_CHARGER=y
CONFIG_OPT3001=y
CONFIG_NRF_FUEL_GAUGE=y

# Storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_ANCS_CLIENT=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_LONG_WQ=y

# IPC with the network core
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
# The network core needs RTC synchronization when it starts.
# Set up the app side before the network core is started.
CONFIG_NRF53_SYNC_RTC_INIT_PRIORITY=45

# Crypto
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_TINYCRYPT_AES_CMAC=y
CONFIG_TINYCRYPT_SHA256=y
CONFIG_TINYCRYPT_SHA256_HMAC=y
CONFIG_TINYCRYPT_SHA256_HMAC_PRNG=y

# Audio codec
CONFIG_LIBLC3=y

# DFU over BLE (SMP)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=3
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_NRF53_UPGRADE_NETWORK_CORE=y
CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y
# the network core image is net_core/, turn off the NCS sample
CONFIG_NCS_INCLUDE_RPMSG_CHILD_IMAGE=n
CONFIG_NCS_SAMPLE_EMPTY_NET_CORE_CHILD_IMAGE=n

# Subsystem tuning
# OpenAMP: the app core is the VIRTIO driver (host) only
CONFIG_OPENAMP_SLAVE=n
CONFIG_ZCBOR_STOP_ON_ERROR=y
# BT: L2CAP SDU RX MTU 496 => ACL RX 502; ATT MTU 498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=498
# BT: PHY and data length update callbacks
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME="Even G1"
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y
CONFIG_BT_GATTP=y
CONFIG_BT_NUS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_POWEROFF=y
CONFIG_BT_ANCS_CLIENT_CP_BUFF_SIZE=4096
CONFIG_BT_LIM_ADV_TIMEOUT=120
# random numbers from the entropy device (CC3xx)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

# cJSON (NCS lib), used by the whitelist/BLE protocol code
CONFIG_CJSON_LIB=y

# CAF: app_event_manager, module_state_event (main.c reports MODULE_STATE_READY)
# and the CAF power manager.
CONFIG_CAF=y
CONFIG_CAF_POWER_MANAGER=y
# power manager: 3 s timeout, stay on instead of entering system off
CONFIG_CAF_POWER_MANAGER_STAY_ON=y
CONFIG_CAF_POWER_MANAGER_TIMEOUT=3
CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y

# printk goes straight to the console, not through the log subsystem
CONFIG_LOG_PRINTK=n
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_SIZE=111
CONFIG_MCUMGR_TRANSPORT_BT_AUTHEN=n
CONFIG_NRF_RPC=y
CONFIG_NRF_RPC_CBOR=y
CONFIG_DK_LIBRARY=y
CONFIG_NRFX_SPIS2=y
CONFIG_NRFX_UARTE1=y
CONFIG_FLASH_LOG_LEVEL_WRN=y
# the rpmsg_nrf53_sram PM partition is 8 KB; must agree with child_image/mcuboot.conf
CONFIG_RPMSG_NRF53_SRAM_SIZE=0x2000
CONFIG_BT_DEVICE_APPEARANCE=833
