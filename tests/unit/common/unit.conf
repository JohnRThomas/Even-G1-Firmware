CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
# BLE handlers use big stack buffers
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# keeps struct k_sem at its target size
CONFIG_POLL=y

# cJSON float printing
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_CJSON_LIB=y
CONFIG_ASSERT=y
CONFIG_PRINTK=y
# harness mutes printk during reset
CONFIG_LOG_PRINTK=n
