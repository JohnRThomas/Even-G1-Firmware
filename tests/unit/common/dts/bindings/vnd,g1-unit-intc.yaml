description: |
  Unit tests only. Interrupt controller stand-in for the pdm0 node: native_sim's
  devicetree has no interrupt controller, and the nordic,nrf-pdm binding requires
  interrupts (Zephyr's dmic_nrfx_pdm.c reads DT_IRQN / DT_IRQ(priority)). Nothing raises
  these interrupts on the host.

compatible: "vnd,g1-unit-intc"

include: [base.yaml, interrupt-controller.yaml]

interrupt-cells:
  - irq
  - priority
