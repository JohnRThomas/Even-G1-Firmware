description: |
  Interrupt controller stand-in for the audio unit suite: native_sim's devicetree has no
  interrupt controller, and the pdm0 node needs interrupts (the nordic,nrf-pdm binding
  requires them, Zephyr's dmic_nrfx_pdm.c reads DT_IRQN / DT_IRQ(priority)). Nothing
  raises these interrupts on the host.

compatible: "vnd,g1-unit-intc"

include: [base.yaml, interrupt-controller.yaml]

interrupt-cells:
  - irq
  - priority
